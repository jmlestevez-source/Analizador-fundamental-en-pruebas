[build]
  publish = "dist"
  command = "npm run build"
  # Skip the production deploy when nothing the deployed site depends on changed.
  # The weekly GitHub Actions screener cache commits (public/data/screener-top-50.json)
  # and CI-only changes (.github/) do NOT trigger a rebuild: the app reads that JSON
  # from GitHub Raw, so redeploying for it just burns 15 production deploy credits
  # on the Netlify Free plan. Exit 0 = skip build, exit 1 = build (unsafe cases build).
  ignore = "bash scripts/netlify-ignore.sh"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Redirect /api/stock/* -> Netlify Function
[[redirects]]
  from = "/api/stock/:ticker"
  to = "/.netlify/functions/stock/:ticker"
  status = 200

# Redirect /api/chart/* -> Netlify Function  
[[redirects]]
  from = "/api/chart/:ticker/:range/:interval"
  to = "/.netlify/functions/chart/:ticker/:range/:interval"
  status = 200

# Redirect /api/search -> Netlify Function
[[redirects]]
  from = "/api/search"
  to = "/.netlify/functions/search"
  status = 200

# Redirect /api/technical -> Netlify Function with query string support
[[redirects]]
  from = "/api/technical"
  to = "/.netlify/functions/technical"
  status = 200

# Redirect /api/technical/* -> Netlify Function
[[redirects]]
  from = "/api/technical/:ticker"
  to = "/.netlify/functions/technical/:ticker"
  status = 200

# SPA fallback: all other routes go to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
